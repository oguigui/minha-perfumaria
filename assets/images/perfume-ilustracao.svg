<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Frasco de perfume GUI Luxury</title>
  <desc id="descricao">Ilustração de um frasco de perfume elegante em tons dourados sobre fundo escuro.</desc>
  <defs>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dfb8" stop-opacity=".82"/>
      <stop offset=".48" stop-color="#a77e42" stop-opacity=".7"/>
      <stop offset="1" stop-color="#3a2d1e" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c6737"/>
      <stop offset=".5" stop-color="#f0d9a7"/>
      <stop offset="1" stop-color="#9d7845"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="210" cy="421" rx="122" ry="18" fill="#000" opacity=".28"/>
  <g filter="url(#sombra)">
    <rect x="166" y="54" width="88" height="72" rx="8" fill="url(#ouro)"/>
    <rect x="151" y="119" width="118" height="28" rx="5" fill="#8d693c" stroke="#e3c58e" stroke-width="2"/>
    <path d="M125 150 Q125 138 139 138 H281 Q295 138 295 150 L321 190 V365 Q321 391 295 391 H125 Q99 391 99 365 V190Z" fill="url(#vidro)" stroke="#e0c18a" stroke-width="3"/>
    <path d="M119 194 Q119 174 136 174 H284 Q301 174 301 194 V354 Q301 371 284 371 H136 Q119 371 119 354Z" fill="#29231a" opacity=".62"/>
    <path d="M132 185 Q138 166 151 166 H163 V358 H143 Q132 358 132 345Z" fill="#fff1d1" opacity=".16"/>
    <rect x="130" y="230" width="160" height="105" rx="2" fill="#d6b477" opacity=".94"/>
    <rect x="137" y="237" width="146" height="91" fill="none" stroke="#76552d" stroke-width="1"/>
    <text x="210" y="272" text-anchor="middle" fill="#302619" font-family="Georgia,serif" font-size="25" letter-spacing="4">GUI</text>
    <text x="210" y="294" text-anchor="middle" fill="#302619" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">LUXURY</text>
    <path d="M164 307 H256" stroke="#76552d" stroke-width="1"/>
    <text x="210" y="320" text-anchor="middle" fill="#302619" font-family="Arial,sans-serif" font-size="6" letter-spacing="2">EAU DE PARFUM</text>
